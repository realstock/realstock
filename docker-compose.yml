services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=RealStockKey123
      - CORS_ORIGIN=*
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://realstock:realstock@postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_LOCAL_ENABLED=false
    depends_on:
      - postgres
      - redis
    volumes:
      - evolution_instances:/evolution/instances
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: evolution-db
    environment:
      - POSTGRES_USER=realstock
      - POSTGRES_PASSWORD=realstock
      - POSTGRES_DB=evolution
    volumes:
      - evolution_db:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: always

volumes:
  evolution_instances:
  evolution_db:
