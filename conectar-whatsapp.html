<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectar WhatsApp - RealStock</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; items-center; justify-content: center; height: 100vh; margin: 0; background: #0f172a; color: white; text-align: center; }
        .card { background: #1e293b; padding: 40px; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        img { background: white; padding: 10px; border-radius: 12px; margin-top: 20px; max-width: 300px; }
        .status { margin-top: 20px; font-weight: bold; color: #10b981; }
        button { background: #4f46e5; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Conectar WhatsApp</h1>
        <p>Escaneie o QR Code abaixo com seu celular</p>
        <div id="qrcode-container">Carregando...</div>
        <button onclick="loadQRCode()">Atualizar QR Code</button>
    </div>

    <script>
        async function loadQRCode() {
            const container = document.getElementById('qrcode-container');
            container.innerHTML = 'Gerando novo código...';
            
            try {
                const response = await fetch('http://localhost:8080/instance/connect/RealStock', {
                    headers: { 'apikey': 'RealStockKey123' }
                });
                const data = await response.json();
                
                if (data.base64) {
                    container.innerHTML = `<img src="${data.base64}" alt="QR Code">`;
                } else if (data.status === 'CONNECTED') {
                    container.innerHTML = '<div class="status">✅ WhatsApp já está conectado!</div>';
                } else {
                    container.innerHTML = '<p>Erro ao carregar. Tente novamente.</p>';
                }
            } catch (e) {
                container.innerHTML = '<p>Erro de conexão com o servidor local.</p>';
            }
        }
        loadQRCode();
    </script>
</body>
</html>
